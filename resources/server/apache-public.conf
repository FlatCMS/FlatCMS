# FlatCMS Apache template for a public/ document root.
# Replace /path/to/flatcms only. The parent rule prevents Apache from parsing
# the project-root .htaccess while public/ is the selected document root.
DocumentRoot "/path/to/flatcms/public"

<Directory "/path/to/flatcms">
    AllowOverride None
    Require all granted
</Directory>

<Directory "/path/to/flatcms/public">
    Options +FollowSymLinks -Indexes
    AllowOverride All
    Require all granted
</Directory>
