# Alternate Nginx template for a project-root document root.
# Adapt root and fastcgi_pass only; no filesystem aliases/symlinks are needed.
server {
    listen 80;
    server_name localhost;
    root "/path/to/flatcms";
    index index.php;
    autoindex off;
    server_tokens off;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location /uploads/ { alias "/path/to/flatcms/public/uploads/"; }
    location /assets/ { alias "/path/to/flatcms/public/assets/"; }
    location /modules/ { alias "/path/to/flatcms/public/modules/"; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:9000;
    }
    location = /public/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/public/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:9000;
    }
    location = /recovery.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/recovery.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ~* ^/(app|bin|config|data|resources|storage|themes|vendor)(/|$) { return 404; }
    location ~* \.(php[0-9]*|phtml|phar)(/|$) { return 404; }
    location ~* (^|/)\.(?!well-known/) { return 404; }
    location ~* (^|/)(web\.config|nginx\.conf|composer\.(json|lock))$ { return 404; }
    location ~* \.(bak|backup(\..*)?|old|orig|save|swp|dist|example|log|lock)$ { return 404; }
}
